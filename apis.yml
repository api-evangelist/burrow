aid: burrow

name: Burrow

image: https://useburrow.com/images/og-home.jpg

description: Burrow provides a client reporting and operations platform for web agencies, offering an event‑driven orchestration layer that ingests
  data from tools like WordPress, Shopify, Stripe, and many others. It supplies SDKs, plugins, and a JSON‑RPC MCP for AI agents to automate agency
  workflows, generate reports, and query analytics. The platform is self‑funded, independent, and built for long‑term agency operations.

